upstream django {
    server web:8000;
}

# ── HTTP port 80 ──────────────────────────────────────────────────────────────
# Primary site server. Also serves the ACME/Let's Encrypt HTTP-01 challenges
# that the custom-domain flow uses to issue TLS certificates.
server {
    listen 80;
    listen [::]:80;
    server_name localhost uddoktardokan.com;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP port 80 — Custom domain catch-all (ACME webroot) ─────────────────────
# Any custom domain not explicitly listed above still answers ACME challenges
# so the Django-side auto-provisioning (certbot --webroot) can validate it.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS — primary site (certificates managed by certbot --nginx) ────────────
# server {
#     listen 443 ssl http2;
#     server_name uddoktarkan.com;
#     ...
# }

# ── HTTPS — Custom domain catch-all (Let's Encrypt per-domain TLS) ────────────
# Every custom domain gets its own certificate in /etc/letsencrypt/live/<domain>/.
# nginx dynamically selects it via the $ssl_server_name SNI host; a connection
# for an unknown domain falls back to the platform certificate hosted by the
# default_server block (configure the same cert that protects uddoktarkan.com).
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # $ssl_server_name is the SNI hostname chosen by the visitor; nginx looks
    # up the certificate files for that exact domain. The `default_server` cert
    # here is used only when the requested domain has no matching certificate.
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
